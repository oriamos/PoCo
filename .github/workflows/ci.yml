name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-app.txt
      # Tests that need torch / spotiflow / a GPU skip or are deselected here; the AI extra is covered by install-test.yml.
      - run: PYTHONPATH=src python -m pytest tests/app -q --deselect tests/app/test_ml_devices_scale.py --deselect tests/app/test_preflight_rehearsal.py --deselect tests/app/test_engines_pipeline.py::test_hybrid_end_to_end --deselect tests/app/test_ml_fault_injection.py::test_import_of_a_few_hundred_files_has_a_flat_memory_profile

  frontend:
    name: frontend (tsc, vitest, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build
      - run: npx playwright-core install --with-deps chromium
      - run: CHROMIUM_PATH="$(node -e "console.log(require('playwright-core').chromium.executablePath())")" npm run e2e

  # Supported Python versions (pyproject: >=3.10; the installers accept 3.10-3.13). The full suite runs on 3.12 above; this
  # lighter job runs the install plus the demo, API-flow, grid and ingest tests on the other versions.
  compat:
    name: python ${{ matrix.python }} (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements-app.txt
      - run: PYTHONPATH=src python -m pytest tests/app/test_demo_smoke.py tests/app/test_api_flow.py tests/app/test_grid.py tests/app/test_imaging_ingest.py -q

  # The release constraints (constraints/release-0.3.0.txt) must stay installable and must pass the same smoke tests.
  constraints:
    name: release constraints (3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-app.txt -c constraints/release-0.3.0.txt
      - run: PYTHONPATH=src python -m pytest tests/app/test_demo_smoke.py tests/app/test_api_flow.py tests/app/test_grid.py tests/app/test_imaging_ingest.py -q

  # Markdown: every relative link and anchor must resolve (no external network access).
  docs:
    name: docs (local links)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/check_markdown_links.py .
